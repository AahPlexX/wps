name: Deploy WPS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply one-shot strict TypeScript repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/GlobeCanvas.tsx')
          text = path.read_text()
          old = '\n'.join([
              '    const canvas = canvasRef.current',
              '    const stage = stageRef.current',
              '    const tooltip = tooltipRef.current',
              '    if (!canvas || !stage || !tooltip) return',
              '',
              "    const ctx = canvas.getContext('2d', { alpha: false })",
              '    if (!ctx) return',
              '',
          ])
          new = '\n'.join([
              '    const canvasNode = canvasRef.current',
              '    const stageNode = stageRef.current',
              '    const tooltipNode = tooltipRef.current',
              '    if (!canvasNode || !stageNode || !tooltipNode) return',
              '',
              "    const context = canvasNode.getContext('2d', { alpha: false })",
              '    if (!context) return',
              '',
              '    const canvas: HTMLCanvasElement = canvasNode',
              '    const stage: HTMLDivElement = stageNode',
              '    const tooltip: HTMLDivElement = tooltipNode',
              '    const ctx: CanvasRenderingContext2D = context',
              '',
          ])
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif 'const canvasNode = canvasRef.current' not in text:
              raise SystemExit('Expected GlobeCanvas null-guard block was not found')

          Path('src/vite-env.d.ts').write_text('/// <reference types="vite/client" />\n')
          PY

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Validate application
        run: npm run validate

      - name: Commit validated integration files
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GlobeCanvas.tsx src/vite-env.d.ts package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete strict TypeScript integration"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
