name: Bootstrap WPS project

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Reconstruct project
        shell: bash
        run: |
          cat .bootstrap/part-* > /tmp/wps.tar.xz.b64
          base64 --decode /tmp/wps.tar.xz.b64 > /tmp/wps.tar.xz
          echo "6d46479421f03c4012a75560975aa7fad193b3d006c0f5b3b668b9e14fd59e20  /tmp/wps.tar.xz" | sha256sum --check -
          tar -xJf /tmp/wps.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/deploy.yml
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: migrate WPS to production React site"
          git push origin HEAD:main
